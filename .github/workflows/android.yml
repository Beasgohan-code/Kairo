name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Run unit tests
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace testDebugUnitTest
          else
            gradle --no-daemon --stacktrace testDebugUnitTest
          fi

      - name: Assemble debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kairo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            app/build/test-results/**
            app/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore

  # Optional lightweight static checks (no extra deps required)
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify no secrets in source
        run: |
          echo "Scanning for common secret patterns..."
          if grep -rE --include='*.java' --include='*.xml' --include='*.gradle' --include='*.properties' \
            -e 'sk-[a-zA-Z0-9]{20,}' \
            -e 'ghp_[a-zA-Z0-9]{20,}' \
            -e 'xox[baprs]-[a-zA-Z0-9-]+' \
            -e 'AKIA[0-9A-Z]{16}' \
            . ; then
            echo "::error::Potential secrets detected in source tree"
            exit 1
          fi
          echo "No obvious secrets found."

      - name: Check for large files
        run: |
          find . -type f -size +5M -not -path './.git/*' | while read f; do
            echo "::warning::Large file detected: $f"
          done
