plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kairo.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kairo.app'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.11.0'
        testInstrumentationRunner 'android.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// Kairo deliberately uses the Android platform UI and networking APIs. Keeping the
// dependency surface small makes the APK easy to audit and keeps the first build fast.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
